<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diary · Ehoes Of Time</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#0b1220; --bg2:#141c2e;
  --cream:#faf7f0; --cream-surface:#ffffff;
  --gold:#d9a35c; --gold-soft:#e8c491;
  --navy:#0f1626; --navy-soft:#1b2436;
  --text:#1b1f27; --text-inv:#f5f1e8;
  --muted:#8a8f9a; --muted-dark:#a9afc2;
  --border:#eae6db; --border-dark:#2a3348;
  --red:#c0475e;
  --radius:20px; --radius-sm:12px; --radius-lg:28px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  font-family:'Georgia','Times New Roman',serif;
  background:var(--navy);
  color:var(--text);
  overflow-x:hidden;
}
.app-shell{max-width:480px;margin:0 auto;position:relative;min-height:100vh;background:var(--cream);}
button{font-family:inherit;border:none;cursor:pointer;background:none;}
svg{display:block;}
a{text-decoration:none;color:inherit;}

/* ---------- HEADER (same as home) ---------- */
#page{padding-bottom:96px;}
.header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
  background:var(--cream);z-index:15;
  border-bottom:1px solid rgba(0,0,0,0.05);
}
.header-spacer{height:calc(env(safe-area-inset-top,0px) + 62px);}
.header-left{display:flex;align-items:center;gap:12px;}
.back-btn{width:22px;height:22px;color:var(--navy);padding:6px;border-radius:50%;margin-left:-6px;transition:background .2s,transform .15s;}
.back-btn:active{background:rgba(217,163,92,0.18);transform:scale(0.9);}
.header-titles h1{font-size:19px;color:var(--navy);}
.header-titles p{font-family:Georgia,serif;font-size:11.5px;color:var(--muted);margin-top:2px;}
.icon-btn{width:22px;height:22px;color:var(--navy);padding:6px;border-radius:50%;transition:background .2s,transform .15s;}
.icon-btn:active{background:rgba(217,163,92,0.18);transform:scale(0.9);}

/* ---------- TODAY'S STORY ---------- */
.diary-intro{position:relative;padding:20px 20px 16px;overflow:hidden;}
.diary-intro::before{
  content:"";position:absolute;top:-30px;right:-40px;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,163,92,0.16),transparent 70%);
  pointer-events:none;
}
.intro-eyebrow{
  display:flex;align-items:center;gap:8px;color:var(--muted);
  font-size:11.5px;letter-spacing:.4px;margin-bottom:6px;
  opacity:0;transform:translateY(6px);animation:gFade .7s ease forwards;
}
.intro-eyebrow .rule{width:20px;height:1px;background:var(--gold);}
.diary-intro h2{
  font-size:24px;color:var(--navy);line-height:1.2;
  opacity:0;transform:translateY(8px);animation:gFade .8s .12s ease forwards;
}
.intro-line{
  margin-top:8px;padding-left:16px;border-left:2px solid var(--gold);
  font-style:italic;color:#5b6270;font-size:13.5px;line-height:1.5;
  opacity:0;transform:translateY(8px);animation:gFade .8s .24s ease forwards;
}
@keyframes gFade{to{opacity:1;transform:translateY(0);}}

/* ---------- SEARCH ---------- */
.search-row{display:flex;gap:10px;padding:4px 20px 16px;}
.search-box{
  flex:1;display:flex;align-items:center;gap:9px;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0 13px;height:44px;
}
.search-box svg{width:17px;height:17px;color:var(--muted);flex-shrink:0;}
.search-box input{
  flex:1;border:none;outline:none;background:none;font-family:inherit;
  font-size:13.5px;color:var(--navy);height:100%;
}
.search-box input::placeholder{color:var(--muted);}

/* ---------- ENTRY LIST ---------- */
.entry-list{display:flex;flex-direction:column;gap:12px;padding:0 20px 8px;}
.entry-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px;box-shadow:0 8px 18px rgba(15,22,38,0.06);
  transition:transform .15s ease;
  opacity:0;transform:translateY(8px);animation:rowIn .5s ease forwards;
}
.entry-card:active{transform:scale(0.98);}
@keyframes rowIn{to{opacity:1;transform:translateY(0);}}
.entry-date{display:block;font-size:11px;letter-spacing:.3px;color:var(--muted);margin-bottom:8px;}
.entry-card h3{font-size:15.5px;color:var(--navy);line-height:1.3;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.entry-preview{font-family:Georgia,serif;font-size:12.5px;color:#5b6270;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ---------- EMPTY STATE ---------- */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 30px;}
.empty-state svg{width:44px;height:44px;color:var(--border);margin-bottom:14px;}
.empty-state h3{font-size:15px;color:var(--navy);margin-bottom:6px;}
.empty-state p{font-size:12.5px;color:var(--muted);line-height:1.5;}

/* ---------- FAB (new note) ---------- */
.fab{
  position:fixed;right:20px;bottom:96px;z-index:25;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(217,163,92,0.35);
  transition:transform .18s ease;
  animation:fabPulse 2.6s ease-in-out infinite;
}
.fab:active{transform:scale(0.9);}
.fab svg{width:22px;height:22px;color:#241705;}
@keyframes fabPulse{
  0%,100%{box-shadow:0 10px 24px rgba(217,163,92,0.35),0 0 0 0 rgba(217,163,92,0.25);}
  50%{box-shadow:0 10px 24px rgba(217,163,92,0.35),0 0 0 8px rgba(217,163,92,0);}
}

/* ---------- BOTTOM NAV (identical to home) ---------- */
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:100%;max-width:480px;
  background:var(--cream-surface);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));
  z-index:20;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;
  padding:4px 10px;border-radius:14px;transition:transform .15s ease,background .2s ease,color .2s ease;}
.nav-item svg{width:21px;height:21px;}
.nav-item.active{color:var(--gold);background:rgba(217,163,92,0.12);}
.nav-item:active{transform:scale(0.88);background:rgba(217,163,92,0.16);}
.nav-fab{
  width:50px;height:50px;border-radius:50%;background:var(--navy);
  display:flex;align-items:center;justify-content:center;margin-top:-26px;
  box-shadow:0 8px 18px rgba(15,22,38,0.35);border:4px solid var(--cream-surface);
  transition:transform .18s ease,box-shadow .25s ease;
  animation:fabPulse2 2.6s ease-in-out infinite;
}
.nav-fab:active{transform:scale(0.9);}
.nav-fab svg{width:20px;height:20px;color:var(--gold-soft);}
@keyframes fabPulse2{
  0%,100%{box-shadow:0 8px 18px rgba(15,22,38,0.35),0 0 0 0 rgba(217,163,92,0.25);}
  50%{box-shadow:0 8px 18px rgba(15,22,38,0.35),0 0 0 7px rgba(217,163,92,0);}
}

/* ---------- NOTE EDITOR (full screen) ---------- */
.editor{
  position:fixed;top:0;bottom:0;left:50%;
  width:100%;max-width:480px;background:var(--cream);z-index:70;
  display:flex;flex-direction:column;
  transform:translateX(-50%) translateY(100%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  visibility:hidden;
}
.editor.show{transform:translateX(-50%) translateY(0);visibility:visible;}
.editor-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
  border-bottom:1px solid rgba(0,0,0,0.05);flex-shrink:0;
}
.editor-btn{width:22px;height:22px;color:var(--navy);padding:6px;border-radius:50%;box-sizing:content-box;
  transition:background .2s,transform .15s;}
.editor-btn:active{background:rgba(217,163,92,0.18);transform:scale(0.9);}
.editor-btn.del{color:var(--red);}
.editor-bar-left{display:flex;align-items:center;gap:12px;}
.save-status{font-size:11.5px;color:var(--muted);}
.editor-body{flex:1;overflow-y:auto;padding:20px 20px calc(30px + env(safe-area-inset-bottom,0px));}
.editor-body input{
  width:100%;border:none;outline:none;background:none;font-family:inherit;
  font-size:22px;color:var(--navy);line-height:1.3;
}
.editor-body input::placeholder,.editor-body textarea::placeholder{color:var(--muted);}
.editor-meta{font-size:11px;letter-spacing:.3px;color:var(--muted);margin:6px 0 16px;}
.editor-body textarea{
  display:block;width:100%;min-height:55vh;border:none;outline:none;background:none;resize:none;
  font-family:Georgia,serif;font-size:15px;line-height:1.75;color:#3a3f4a;overflow:hidden;
}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:var(--text-inv);padding:11px 20px;border-radius:24px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  z-index:100;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.3);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(min-width:768px){.app-shell{border-left:1px solid var(--border);border-right:1px solid var(--border);}}

/* ==========================================================
   DESKTOP (>=900px) — left sidebar nav + centered dialogs
   ========================================================== */
@media (min-width:900px){
  :root{--sidebar-w:88px;}

  .app-shell{max-width:none;margin:0 0 0 var(--sidebar-w);}

  .header{left:var(--sidebar-w);right:0;top:0;transform:none;margin:0;width:auto;max-width:none;padding-left:32px;padding-right:32px;}

  #page{padding-bottom:40px;}

  .bottom-nav{
    left:0;right:auto;top:0;bottom:0;transform:none;margin:0;
    width:var(--sidebar-w);max-width:none;height:100vh;
    flex-direction:column;justify-content:flex-start;align-items:center;
    gap:8px;padding:28px 0 20px;
    border-top:none;border-right:1px solid var(--border);
  }
  .nav-item{width:64px;padding:8px 4px;}
  .nav-fab{margin-top:4px;order:-1;}
  .fab{bottom:24px;}

  .sheet{
    left:50%;top:50%;bottom:auto;right:auto;
    width:92%;max-width:440px;max-height:86vh;
    border-radius:24px;
    transform:translate(-50%,-50%) scale(.95);
    opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease;
  }
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}

.entry-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:0 32px 32px;}
}
</style>
</head>
<body>

<div class="app-shell">

  <section id="page">
    <header class="header">
      <div class="header-left">
        <a href="index.html"><svg class="back-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></a>
        <div class="header-titles">
          <h1>Diary</h1>
          <p>Your thoughts, memories, and moments.</p>
        </div>
      </div>
      <svg class="icon-btn" onclick="toast('Diary options coming soon')" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </header>
    <div class="header-spacer"></div>

    <div class="diary-intro">
      <div class="intro-eyebrow"><span class="rule"></span>TODAY'S STORY</div>
      <h2 id="introDate">Today</h2>
      <p class="intro-line">Write something worth remembering.</p>
    </div>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Search your memories..." oninput="render()">
      </div>
    </div>

    <div class="entry-list" id="entryList"></div>

    <div class="empty-state" id="emptyState" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4h9l3 3v13a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1Z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
      <h3 id="emptyTitle">No notes yet</h3>
      <p id="emptyText">Tap + to write your first memory.</p>
    </div>
  </section>

  <div class="fab" onclick="openNew()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="photos.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
      Explore
    </a>
    <div class="nav-fab" onclick="toast('Quick add coming soon')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <a href="diary.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h9l3 3v13a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1Z"/><path d="M9 9h6M9 13h6"/></svg>
      Journal
    </a>
    <div class="nav-item" onclick="toast('Settings coming soon')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.6 1Z"/></svg>
      Settings
    </div>
  </nav>

  <!-- NOTE EDITOR -->
  <div class="editor" id="editor">
    <div class="editor-bar">
      <div class="editor-bar-left">
        <svg class="editor-btn" onclick="closeEditor()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="save-status" id="saveStatus"></span>
      </div>
      <svg class="editor-btn del" id="delBtn" onclick="deleteNote()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/></svg>
    </div>
    <div class="editor-body">
      <input id="eTitle" placeholder="Title" maxlength="120" oninput="onEdit()">
      <div class="editor-meta" id="eMeta"></div>
      <textarea id="eText" placeholder="Write what's on your mind..." oninput="onEdit()"></textarea>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let notes = [], loaded = false;
let cur = null, saveT = null, chain = Promise.resolve();
function setData(list){ notes = list; loaded = true; render(); }

function fmtDate(ts){
  return new Date(ts).toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtFull(ts){
  const d = new Date(ts);
  return fmtDate(ts)+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

/* ---- list ---- */
function render(){
  const list = $('entryList');
  const q = $('searchInput').value.trim().toLowerCase();
  const items = notes
    .slice()
    .sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0))
    .filter(n=>!q || ((n.title||'')+' '+(n.text||'')).toLowerCase().includes(q));
  list.innerHTML = '';
  items.forEach((n,i)=>{
    const text = (n.text||'').replace(/\s+/g,' ').trim();
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.style.animationDelay = (i*0.05)+'s';
    card.innerHTML = `
      <span class="entry-date">${fmtDate(n.updated||n.created)}</span>
      <h3>${esc(n.title||'Untitled')}</h3>
      <p class="entry-preview">${esc(text.slice(0,140))}</p>`;
    card.onclick = ()=>openNote(n);
    list.appendChild(card);
  });
  $('emptyTitle').textContent = notes.length ? 'No memories found' : 'No notes yet';
  $('emptyText').textContent = notes.length ? 'Try another search.' : 'Tap + to write your first memory.';
  $('emptyState').style.display = (loaded && items.length===0) ? 'flex' : 'none';
}

/* ---- editor ---- */
function autoGrow(){
  const ta = $('eText');
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, window.innerHeight*0.55)+'px';
}
function showEditor(){
  $('editor').classList.add('show');
  $('delBtn').style.display = cur && cur.id ? 'block' : 'none';
  $('saveStatus').textContent = '';
  autoGrow();
}
function openNew(){
  cur = {created:Date.now()};
  $('eTitle').value = ''; $('eText').value = '';
  $('eMeta').textContent = fmtFull(cur.created);
  showEditor();
  setTimeout(()=>$('eTitle').focus(), 320);
}
function openNote(n){
  cur = n;
  $('eTitle').value = n.title || ''; $('eText').value = n.text || '';
  $('eMeta').textContent = 'Edited '+fmtFull(n.updated||n.created);
  showEditor();
}
function onEdit(){
  autoGrow();
  $('saveStatus').textContent = 'Saving…';
  clearTimeout(saveT);
  saveT = setTimeout(flush, 700);
}
function flush(){
  clearTimeout(saveT);
  chain = chain.then(doSave).catch(()=>{ $('saveStatus').textContent = 'Not saved'; });
  return chain;
}
async function doSave(){
  const n = cur; if(!n) return;
  const title = $('eTitle').value.trim(), text = $('eText').value.trim();
  if(!n.id){
    if(!title && !text) { $('saveStatus').textContent = ''; return; }
    const rec = {title, text, created:n.created, updated:Date.now()};
    n.id = await window.dbAdd(rec);
    Object.assign(n, rec);
    notes.unshift(n);
    $('delBtn').style.display = 'block';
  }else{
    if(title===(n.title||'') && text===(n.text||'')){ $('saveStatus').textContent = 'Saved'; return; }
    const data = {title, text, updated:Date.now()};
    await window.dbUpd(n.id, data);
    Object.assign(n, data);
  }
  $('eMeta').textContent = 'Edited '+fmtFull(n.updated);
  $('saveStatus').textContent = 'Saved';
}
async function closeEditor(){
  await flush();
  const n = cur;
  if(n && n.id && !(n.title||n.text)){
    try{ await window.dbDel(n.id); notes = notes.filter(x=>x.id!==n.id); }catch(e){ toast('Could not remove empty note'); }
  }
  $('editor').classList.remove('show');
  cur = null;
  render();
}
async function deleteNote(){
  const n = cur; if(!n || !n.id) return;
  if(!confirm('Delete this note? This cannot be undone.')) return;
  clearTimeout(saveT);
  try{
    await chain;
    await window.dbDel(n.id);
    notes = notes.filter(x=>x.id!==n.id);
    $('editor').classList.remove('show');
    cur = null;
    toast('Note deleted');
    render();
  }catch(e){ toast('Could not delete'); }
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 1800);
}

$('introDate').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});

render();
</script>
<script type="module">
