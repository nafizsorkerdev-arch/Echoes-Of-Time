<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ehoes Of Time</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#0b1220; --bg2:#141c2e;
  --cream:#faf7f0; --cream-surface:#ffffff;
  --gold:#d9a35c; --gold-soft:#e8c491;
  --navy:#0f1626; --navy-soft:#1b2436;
  --text:#1b1f27; --text-inv:#f5f1e8;
  --muted:#8a8f9a; --muted-dark:#a9afc2;
  --border:#eae6db; --border-dark:#2a3348;
  --radius:20px; --radius-sm:12px; --radius-lg:28px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  font-family:'Georgia','Times New Roman',serif;
  background:var(--navy);
  color:var(--text);
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.app-shell{max-width:480px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;background:var(--cream);}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed;inset:0;z-index:50;
  height:100vh;height:100dvh;width:100%;max-width:480px;left:50%;transform:translateX(-50%);
  background:
    radial-gradient(ellipse at 50% 38%, rgba(217,163,92,0.10), transparent 60%),
    linear-gradient(160deg,#0a0e17 0%, #10182a 45%, #171025 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6vh 32px;text-align:center;
  overflow:hidden;
  opacity:0; animation:bgIn 0.9s ease forwards;
  transition:opacity .3s ease;
}
#splash.fade-out{opacity:0;}
@keyframes bgIn{to{opacity:1;}}

/* ---------- LOGO + RING ---------- */
.logo-stage{
  position:relative;
  width:150px;height:150px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:26px;
}
.ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:1px solid transparent;
  border-top-color:rgba(217,163,92,0.55);
  border-right-color:rgba(217,163,92,0.18);
  opacity:0;
  animation:ringFade 1s .8s ease forwards, ringSpin 14s linear infinite;
  animation-delay:.8s, 0s;
}
@keyframes ringFade{to{opacity:1;}}
@keyframes ringSpin{to{transform:rotate(360deg);}}

.particle{
  position:absolute;border-radius:50%;
  background:var(--gold-soft);
  opacity:0;
  animation:pFade 3s ease forwards, pDrift 6s ease-in-out infinite;
}
@keyframes pFade{
  0%{opacity:0;} 100%{opacity:.55;}
}
@keyframes pDrift{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(var(--dx,4px),var(--dy,-4px));}
}
.p1{width:3px;height:3px;top:6%;left:12%;animation-delay:1.1s,1.9s;--dx:5px;--dy:-6px;}
.p2{width:2px;height:2px;top:88%;right:10%;animation-delay:1.3s,2.1s;--dx:-4px;--dy:5px;}
.p3{width:2.5px;height:2.5px;top:14%;right:6%;animation-delay:1.5s,2.3s;--dx:-3px;--dy:4px;}
.p4{width:2px;height:2px;bottom:10%;left:8%;animation-delay:1.7s,2.5s;--dx:4px;--dy:-3px;}

.logo-glow{
  position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle, rgba(217,163,92,0.22), transparent 70%);
  opacity:0;
  animation:glowFade 1.2s .2s ease forwards, breathe 2.6s 2.2s ease-in-out infinite;
}
@keyframes glowFade{to{opacity:1;}}
@keyframes breathe{
  0%,100%{opacity:0.7;transform:scale(1);}
  50%{opacity:1;transform:scale(1.06);}
}

.logo-img{
  position:relative;width:96px;height:96px;object-fit:contain;
  opacity:0;transform:scale(0.82);
  animation:logoIn .8s .2s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes logoIn{to{opacity:1;transform:scale(1);}}

/* ---------- BRAND TEXT ---------- */
.brand-name{
  font-size:22px;letter-spacing:3px;color:var(--gold-soft);
  text-transform:uppercase;
  opacity:0;transform:translateY(8px);
  animation:fadeUp .8s 1s ease forwards;
}
.brand-tag{
  margin-top:10px;
  font-family:Georgia,serif;font-size:13px;letter-spacing:1px;color:#cfd3e0;
  opacity:0;transform:translateY(6px);
  animation:fadeUp .8s 1.5s ease forwards;
}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

/* ---------- REDUCED MOTION ---------- */
@media (prefers-reduced-motion: reduce){
  #splash{animation:none;opacity:1;}
  .ring{animation:none;opacity:.5;}
  .particle{animation:none;opacity:0;}
  .logo-glow{animation:none;opacity:.8;}
  .logo-img{animation:none;opacity:1;transform:scale(1);}
  .brand-name{animation:none;opacity:1;transform:none;}
  .brand-tag{animation:none;opacity:1;transform:none;}
}

@media(min-width:768px){
  .app-shell{border-left:1px solid var(--border);border-right:1px solid var(--border);}
}
</style>
</head>
<body>

<div class="app-shell">
  <section id="splash">
    <div class="logo-stage">
      <div class="ring"></div>
      <div class="logo-glow"></div>
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>
      <img class="logo-img" src="logo.png" alt="Ehoes Of Time">
    </div>
    <div class="brand-name">Ehoes Of Time</div>
    <div class="brand-tag">Preserve what matters.</div>
  </section>
</div>

<script>
(function(){
  var splash = document.getElementById('splash');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HOLD = reduced ? 2700 : 2700; // start fade so total ≈ 3s
  var FADE = 300;

  setTimeout(function(){
    splash.classList.add('fade-out');
    setTimeout(function(){
      window.location.href = 'index.html';
    }, FADE);
  }, HOLD);
})();
</script>
</body>
</html>
